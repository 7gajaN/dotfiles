# Minimal black greeter on the main monitor only.
# Overrides /usr/lib/sddm/sddm.conf.d/default.conf; that file stays untouched
# and keeps supplying every other default.

[Theme]
Current=black

[X11]
# Replaces the packaged /usr/share/sddm/scripts/Xsetup, which is a stub and
# would be overwritten on the next sddm upgrade.
DisplayCommand=/etc/sddm/Xsetup
