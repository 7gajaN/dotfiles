# Minimal tmux config -- deliberately small. Add to it once you know what
# actually annoys you, rather than copying someone else's 200-line file.

# Ctrl-b is the default prefix and is awkward next to Ctrl-a/Ctrl-e in a
# shell. Ctrl-Space is free, close to the thumb, and does not collide with
# readline or with the ALT-based Hyprland bindings in hyprland.lua.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split using the keys the panes visually resemble, and open the new pane
# in the same directory as the current one -- tmux's default is $HOME,
# which is almost never what you want.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Move between panes with the same hjkl directions ALT+hjkl already uses
# for windows in Hyprland, so the muscle memory transfers.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Windows (tmux's tabs) count from 1: 0 is a long reach, and the number
# keys then line up with their position on screen.
set -g base-index 1
setw -g pane-base-index 1

# Mouse on: scroll, click a pane to focus, drag a divider to resize. The
# purist objection does not survive contact with a scroll wheel.
set -g mouse on

# Scrollback. The default 2000 lines is small once panes are long-lived,
# and this is the buffer tmux-resurrect would later capture from.
set -g history-limit 50000

# Renumber windows when one closes, so there are no gaps to skip over.
set -g renumber-windows on

# Escape has no delay -- the default 500ms is felt immediately in vim/nvim.
set -sg escape-time 0

# Tell programs inside tmux that colour works. kitty reports truecolor;
# without this tmux downgrades it and nvim themes look wrong.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:RGB"

# Reload this file with prefix + r, so edits are one keystroke away.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
# Persistence across reboots
# ---------------------------------------------------------------------------
# A tmux server is a process: closing a terminal leaves it running, but a
# reboot kills it and every session with it. These two plugins are what
# bridge that gap. They are cloned outside this repo, in
# ~/.local/share/tmux/plugins, because they are third-party code and this
# directory is symlinked into a dotfiles repo.
#
# resurrect saves the session layout to disk and restores it on request.
# continuum drives resurrect on a timer and restores automatically when the
# tmux server next starts. Load order matters: continuum after resurrect.

# Saved state lives under ~/.local/state, next to the Hyprland session
# snapshots, rather than resurrect's default inside ~/.tmux.
set -g @resurrect-dir '~/.local/state/tmux/resurrect'

# The line that does what you actually asked for: save the visible text of
# each pane, so a restored pane still shows the output that was on screen --
# the `git status` result, not just a fresh prompt in the right directory.
set -g @resurrect-capture-pane-contents 'on'

# Restore automatically when the tmux server starts, rather than needing
# prefix + Ctrl-r by hand.
set -g @continuum-restore 'on'

# Save every 5 minutes. This is the drift window: work in the last few
# minutes before a crash is not captured. Lower it if that bites.
set -g @continuum-save-interval '5'

run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux

# resurrect binds save to prefix + Ctrl-s and restore to prefix + Ctrl-r by
# default. Ctrl-s collides with terminal flow control (XOFF) on any tty that
# has not disabled it, where it freezes the terminal instead of reaching
# tmux. Bind plain letters instead: prefix + S saves, prefix + R restores.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
