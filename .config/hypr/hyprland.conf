# ===============================
#   Autostart
# ===============================
# Remove the '&' for exec-once commands in Hyprland
exec-once = swww-daemon
exec-once = sleep 1 && swww img $(find ~/.config/pics/wallpaper.png -type f | shuf -n 1)
exec-once = waybar

# ===============================
#   Display & Monitor
# ===============================
monitor = DP-0,1920x1080@239.76,0x0,1

# ===============================
#   Input
# ===============================
input {
    kb_layout = us
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ===============================
#   General & Layout
# ===============================
general {
    gaps_in = 5 
    gaps_out = 5 
    border_size = 2
    # Fixed color format
    col.active_border = rgba(B22222ff) rgba(3B4252ff) 45deg
    col.inactive_border = rgba(3B4252ff) rgba(D8DEE9ff) 45deg
    layout = dwindle
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

# ===============================
#   Decoration
# ===============================
decoration {
    # You had rounding=10 at the top and rounding=0 at the bottom of your old file.
    # The bottom one usually wins, but 10 looks smoother. Change to 0 if you prefer square.
    rounding = 10

    # Keep global opacity at 1.0 so browsers/games don't flicker.
    # We use window rules for specific transparency (like kitty).
    active_opacity = 1.0
    inactive_opacity = 1.0 
    fullscreen_opacity = 1.0

    blur {
        enabled = false
        size = 7
        passes = 3
    }

    # New Shadow Syntax
    shadow {
        enabled = no
        range = 4
        render_power = 3
        color = rgba(26, 26, 26, 238)
    }
}

# ===============================
#   Animations
# ===============================
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ===============================
#   Misc
# ===============================
misc {
    force_default_wallpaper = 0
}

# ===============================
#   Keybindings
# ===============================
$mod = ALT

# Apps
bind = $mod, RETURN, exec, kitty
bind = $mod SHIFT, RETURN, exec, firefox
bind = $mod SHIFT, V, exec, kitty -e ranger

# System
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, togglefloating
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exit

# Focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move
bind = $mod SHIFT, H, swapwindow, l
bind = $mod SHIFT, J, swapwindow, d
bind = $mod SHIFT, K, swapwindow, u
bind = $mod SHIFT, L, swapwindow, r

# Resize (Split)
bind = $mod, V, splitratio, -0.1
bind = $mod, B, splitratio, 0.1

# Submap: Resize
bind = $mod, R, submap, resize
submap = resize
bind = , H, resizeactive, -10 0
bind = , J, resizeactive, 0 10
bind = , K, resizeactive, 0 -10
bind = , L, resizeactive, 10 0
bind = , RETURN, submap, reset
bind = , ESCAPE, submap, reset
bind = $mod, R, submap, reset
submap = reset

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
